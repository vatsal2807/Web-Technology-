<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart City Portal - Admin Login</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .login-card h2 {
            color: #333333;
            margin-bottom: 10px;
            font-size: 24px;
        }

        .login-card p {
            color: #666666;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #444444;
            margin-bottom: 8px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #cccccc;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            border-color: #2a5298;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background-color: #2a5298;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .login-btn:hover {
            background-color: #1e3c72;
        }

        #error-msg {
            color: #d9534f;
            font-size: 13px;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Smart City Portal</h2>
        <p>Enter admin credentials to access system</p>
        
        <form id="loginForm">
            <div class="input-group">
                <label for="password">Admin Password</label>
                <input type="password" id="password" placeholder="Enter secure password" required>
            </div>
            
            <button type="submit" class="login-btn">Login to Dashboard</button>
            <div id="error-msg">Incorrect password. Please try again.</div>
        </form>
    </div>

    <script>
        // Define the only two allowed admin passwords
        const allowedPasswords = ["SmartCity2026!", "AdminPortal@99"];

        const loginForm = document.getElementById('loginForm');
        const passwordInput = document.getElementById('password');
        const errorMsg = document.getElementById('error-msg');

        loginForm.addEventListener('submit', function(event) {
            // Prevent actual form submission/page reload
            event.preventDefault();

            const enteredPassword = passwordInput.value.trim();

            // Check if entered password matches any of the two allowed keys
            if (allowedPasswords.includes(enteredPassword)) {
                // Save login state in sessionStorage
                sessionStorage.setItem("isLoggedIn", "true");
                
                // Redirect to homepage dashboard
                window.location.href = "home.html";
            } else {
                // Show error message and clear field
                errorMsg.style.display = "block";
                passwordInput.value = "";
                passwordInput.focus();
            }
        });
    </script>

</body>
</html>
